<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Coll</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Optionnel : Import d'une police plus moderne -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <!-- HEADER top bar -->
    <header>
      <div class="logo-container">
        <span class="logo-icon">&lt;/&gt;</span>
        <span class="logo-text">Code Coll</span>
      </div>

      <div class="header-actions">
        <button class="btn-execute">▶ Exécuter</button>
        <button id="btn-share" class="btn-invite">🔗 Inviter</button>
        <button class="btn-settings">⚙️</button>
      </div>
    </header>

    <!-- CONTENEUR PRINCIPAL (Sidebar + Editeur) -->
    <div class="main-container">
      <!-- Sidebar / Explorateur à gauche -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Explorateur</span>
        </div>

        <button id="btn-open-folder" class="btn-open-folder">
          📂 Ouvrir un dossier
        </button>

        <div id="file-tree"></div>
      </aside>

      <!-- Zone d'édition à droite -->
      <main id="editor-container">
        <div id="editor"></div>
      </main>
    </div>

    <div id="bottom-panel">
      <div class="panel-header">
        <span class="panel-title">TERMINAL</span>
      </div>
      <!-- Le conteneur où Xterm.js va s'injecter -->
      <div id="terminal-container"></div>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="terminal-server.js"></script>
  </body>
</html>
